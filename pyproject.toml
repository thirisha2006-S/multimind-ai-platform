[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimind-ai-platform"
version = "0.1.0"
description = "The AI Operating System for Enterprises — unifying organizational knowledge, documents, projects, employees, and business intelligence into one secure, multi-agent platform with explainable AI, organizational memory, and decision support."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Multimind AI Team", email = "thirishasriram079@gmail.com"}
]
dependencies = [
    "streamlit>=1.30.0",
    "langchain>=0.1.0",
    "langgraph>=0.0.1",
    "langchain-openai>=0.0.5",
    "langchain-community>=0.0.10",
    "cohere>=5.0.0",
    "tavily-python>=0.3.0",
    "faiss-cpu>=1.7.4",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "httpx>=0.25.0",
    "plotly>=5.14.0",
    "requests>=2.31.0",
    "python-docx>=0.8.11",
    "PyPDF2>=3.0.0",
    "openpyxl>=3.1.2",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.urls]
Repository = "https://github.com/thirisha2006-S/multimind-ai-platform"

[tool.setuptools.packages.find]
where = ["src"]
